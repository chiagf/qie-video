# Builds this folder as a Docker container and pushes to GHCR.
# Repo root = this folder (qie-video), so the build context is ".". The `qie_engine` engine
# comes in as a git submodule and is pip-installed into the image.
#
# Run: Actions -> build-push-docker -> Run workflow (also runs on every push to main).
# Pull: docker pull ghcr.io/<owner>/<repo>:latest   (Vast/RunPod image field)
name: build-push-docker

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # The suites are CPU-only and torch-free. Pillow backs the blend interpolator tests;
      # gradio lets the app suite import video_ui for real, which the AST check cannot do.
      - name: Install test deps (no torch)
        run: pip install pillow "gradio==6.20.0"

      - name: Engine tests (CPU-only, no torch)
        working-directory: vendor/qie-engine
        run: python -m unittest discover -s tests -v

      - name: App tests (CPU-only, no torch)
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free disk space (torch cu128 layers are big)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
